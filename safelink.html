<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Be My Valentine?</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      /* Changed to background image (replace with your own image URL) */
      background: url('IMG_1031.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .card {
      position: relative;
      background: rgba(255, 255, 255, 0.2);
      padding: 35px 25px 70px;
      border-radius: 25px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px);
    }

    h1 {
      font-size: 26px;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px; /* Space between buttons */
      margin-top: 20px;
    }

    button {
      border: none;
      padding: 14px 26px;
      border-radius: 40px;
      font-size: 17px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .yes {
      background: #ff2e63;
      color: white;
    }

    .yes:hover {
      transform: scale(1.15);
      box-shadow: 0 0 15px rgba(255, 46, 99, 0.8);
    }

    .no {
      background: white;
      color: #ff2e63;
    }

    .message {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #ff2e63;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .message.show {
      opacity: 1;
    }

    .heart {
      position: absolute;
      font-size: 20px;
      animation: float 6s linear infinite;
      opacity: 0.8;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(1);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>💌 Will you be my Valentine? 💌</h1>
    <div class="buttons">
      <button class="yes" onclick="yesClicked()">Yes 💖</button>
      <button class="no" id="noBtn" onclick="noClicked()">No 🙈</button>
    </div>
    <div id="message" class="message"></div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.querySelector(".yes");
    const messageDiv = document.getElementById("message");
    let yesScale = 1;

    const messages = [
      "Sure ka?😳",
      "Ayaw mo?🥺",
      "Last na oh😔",
      "Yes na kasi😤",
    ];
    let count = 0;

    // 👉 EDIT THESE DETAILS
    const DATE = "February 13, 2026";
    const TIME = "1:00 PM";
    const PLACE = "Somewhere Cafe";

    function noClicked() {
      if (count < messages.length) {
        // Show the next message in the card box
        messageDiv.innerText = messages[count];
        messageDiv.classList.add("show");
        count++;

        // Scale up the Yes button to encourage clicking it
        yesScale += 0.1;
        yesBtn.style.transform = `scale(${yesScale})`;
      } else {
        // After the last message, remove the No button
        noBtn.style.display = 'none';
      }
    }

    function yesClicked() {
      document.body.innerHTML = `
        <div style="text-align:center; padding:30px;">
          <h1 style="font-size:30px;">
            YAYYY!!! 💕🥰
          </h1>
          <p style="font-size:20px; margin-top:20px;">
            💖 <b>Date:</b> ${DATE}<br><br>
            ⏰ <b>Time:</b> ${TIME}<br><br>
            📍 <b>Place:</b> ${PLACE}
          </p>
          <p style="margin-top:30px; font-size:18px;">
            See you, my Valentine 🌹💘
          </p>
        </div>
      `;
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerText = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (4 + Math.random() * 3) + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }

    setInterval(createHeart, 400);
  </script>
</body>
</html>
